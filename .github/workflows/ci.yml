name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend lint, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      SESSION_SECRET: ci-session-secret
      HIBP_USE_MOCK: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov -- --runInBand
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: server/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      SESSION_SECRET: ci-session-secret
      HIBP_USE_MOCK: true
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safeid_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: safeid_db
        options: >-
          --health-cmd "pg_isready -U safeid_user -d safeid_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://safeid_user:ci_password@localhost:5432/safeid_db
      - run: npm run test:integration -- --runInBand
        env:
          DATABASE_URL: postgresql://safeid_user:ci_password@localhost:5432/safeid_db

  e2e:
    name: Backend E2E tests
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 15
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      SESSION_SECRET: ci-session-secret
      HIBP_USE_MOCK: true
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safeid_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: safeid_db
        options: >-
          --health-cmd "pg_isready -U safeid_user -d safeid_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://safeid_user:ci_password@localhost:5432/safeid_db
      - run: npm run test:e2e -- --runInBand
        env:
          DATABASE_URL: postgresql://safeid_user:ci_password@localhost:5432/safeid_db