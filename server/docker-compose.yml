services:
  postgres:
    image: postgres:16-alpine
    container_name: safeid-postgres
    environment:
      POSTGRES_USER: safeid_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: safeid_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - safeid-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeid_user -d safeid_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safeid-redis
    # Igual à produção (parameter group safeid-redis-queues): o BullMQ exige noeviction
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - safeid-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: safeid-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://safeid_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/safeid_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_PORT: 3000
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      HIBP_BASE_URL: ${HIBP_BASE_URL:-https://haveibeenpwned.com/api/v3}
      HIBP_USE_MOCK: ${HIBP_USE_MOCK:-false}
      # Limite da HIBP vem do plano (/subscription/status); HIBP_RPM_LIMIT só reduz
      HIBP_RPM_LIMIT: ${HIBP_RPM_LIMIT:-}
      HIBP_RPM_SAFETY_FACTOR: ${HIBP_RPM_SAFETY_FACTOR:-0.9}
      HIBP_RPM_FALLBACK: ${HIBP_RPM_FALLBACK:-10}
      HIBP_EXPECTED_LATENCY_S: ${HIBP_EXPECTED_LATENCY_S:-1.5}
      APP_ROLE: ${APP_ROLE:-all}
      # Em dev os e-mails só aparecem no log (assunto + link)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - safeid-network
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  app_node_modules:

networks:
  safeid-network:
    driver: bridge
